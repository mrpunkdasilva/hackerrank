version: '3.8'

services:
  mysql:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackerrank-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hackerrank
      MYSQL_USER: hackerrank
      MYSQL_PASSWORD: hackerrank
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - hackerrank-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hackerrank-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - hackerrank-network

volumes:
  mysql-data:

networks:
  hackerrank-network:
    driver: bridge